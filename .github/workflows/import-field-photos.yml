name: Import field photos

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-field-photos.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Download, rotate and optimize photos
        env:
          GUTTER_URL: "https://gwvckixiegkllthleuyt.supabase.co/storage/v1/object/sign/paid-ads-chat-files/5fafe1f0-cbab-4107-9564-6010b9644e1d/20685476-ff74-4a2e-99a4-7b88fe2f1c06/39b091ee-14e6-4b0b-9c1d-a412ece78042/e40f6521-9778-4c70-a30c-a6f34438e909.jpg?token=eyJraWQiOiIzMDE4YTQ0YS05ZGQ3LTQ1ZjQtOWFkMy1mY2IxMzg3MGFlZjUiLCJhbGciOiJIUzI1NiJ9..BqJqzp3QE5zuJSXrbAe0ljzCzEKQuGxaoILLYS7Dn5w"
          ALEX_URL: "https://gwvckixiegkllthleuyt.supabase.co/storage/v1/object/sign/paid-ads-chat-files/5fafe1f0-cbab-4107-9564-6010b9644e1d/20685476-ff74-4a2e-99a4-7b88fe2f1c06/39b091ee-14e6-4b0b-9c1d-a412ece78042/aa19fcd1-ff05-4e6f-b599-75a52b3fa37e.jpg?token=eyJraWQiOiIzMDE4YTQ0YS05ZGQ3LTQ1ZjQtOWFkMy1mY2IxMzg3MGFlZjUiLCJhbGciOiJIUzI1NiJ9..ljpbCsih5vE-eC48Ox1XOL9AvgSxI5x2xjMvPFT-cEE"
        run: |
          curl -L "$GUTTER_URL" -o /tmp/gutter.jpg
          curl -L "$ALEX_URL" -o /tmp/alex.jpg
          python - <<'PY'
          from PIL import Image
          for src, stem in [('/tmp/gutter.jpg','gutter-guard-micro-mesh-installed'),('/tmp/alex.jpg','alex-owner-installing-gutter-guards')]:
              im = Image.open(src).convert('RGB').rotate(90, expand=True)
              im.thumbnail((1600,1600), Image.Resampling.LANCZOS)
              im.save(stem+'.jpg', quality=86, optimize=True, progressive=True)
              im.save(stem+'.webp', 'WEBP', quality=82, method=6)
          PY
      - name: Commit photos
        run: |
          git config user.name "CleanGutters site updater"
          git config user.email "actions@users.noreply.github.com"
          git add gutter-guard-micro-mesh-installed.jpg gutter-guard-micro-mesh-installed.webp alex-owner-installing-gutter-guards.jpg alex-owner-installing-gutter-guards.webp
          git commit -m "Add Alex installation and micro-mesh photos"
          git push
