name: Restore correct field photos

on:
  push:
    branches: [main]
    paths: [.github/workflows/restore-correct-field-photos.yml]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Save camera-correct photos and image crops
        run: |
          curl -L "https://tpc.googlesyndication.com/simgad/7642855119294241672" -o /tmp/gutter.jpg
          curl -L "https://tpc.googlesyndication.com/simgad/14874282419723731841" -o /tmp/alex.jpg
          python - <<'PY'
          from PIL import Image
          for src,stem in [('/tmp/gutter.jpg','gutter-guard-micro-mesh-installed'),('/tmp/alex.jpg','alex-owner-installing-gutter-guards')]:
              im=Image.open(src).convert('RGB'); im.thumbnail((1600,1600),Image.Resampling.LANCZOS)
              im.save(stem+'.jpg',quality=86,optimize=True,progressive=True); im.save(stem+'.webp','WEBP',quality=82,method=6)
          im=Image.open('gutter-guard-micro-mesh-installed.jpg').convert('RGB')
          w,h=im.size; crop_h=int(w/(1200/628)); top=max(0,(h-crop_h)//2)
          im.crop((0,top,w,top+crop_h)).resize((1200,628),Image.Resampling.LANCZOS).save('gutter-guard-micro-mesh-search-landscape.jpg',quality=88,optimize=True,progressive=True)
          side=min(w,h); top=max(0,(h-side)//2)
          im.crop((0,top,side,top+side)).resize((1200,1200),Image.Resampling.LANCZOS).save('gutter-guard-micro-mesh-search-square.jpg',quality=88,optimize=True,progressive=True)
          PY
      - name: Commit photos
        run: |
          git config user.name "CleanGutters site updater"
          git config user.email "actions@users.noreply.github.com"
          git add gutter-guard-micro-mesh-installed.* alex-owner-installing-gutter-guards.* gutter-guard-micro-mesh-search-*.jpg
          git commit -m "Restore camera-correct field photos"
          git push
