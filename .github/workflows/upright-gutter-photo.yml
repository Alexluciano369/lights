name: Upright gutter photo

on:
  push:
    branches: [main]
    paths: [.github/workflows/upright-gutter-photo.yml]

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Correct gutter orientation and rebuild ad crops
        run: |
          python - <<'PY'
          from PIL import Image
          im=Image.open('gutter-guard-micro-mesh-installed.jpg').convert('RGB').rotate(-90,expand=True)
          im.save('gutter-guard-micro-mesh-installed.jpg',quality=86,optimize=True,progressive=True)
          im.save('gutter-guard-micro-mesh-installed.webp','WEBP',quality=82,method=6)
          w,h=im.size
          crop_h=int(w/(1200/628)); top=max(0,(h-crop_h)//2)
          im.crop((0,top,w,top+crop_h)).resize((1200,628),Image.Resampling.LANCZOS).save('gutter-guard-micro-mesh-search-landscape.jpg',quality=88,optimize=True,progressive=True)
          side=min(w,h); top=max(0,(h-side)//2)
          im.crop((0,top,side,top+side)).resize((1200,1200),Image.Resampling.LANCZOS).save('gutter-guard-micro-mesh-search-square.jpg',quality=88,optimize=True,progressive=True)
          PY
      - name: Commit upright photo
        run: |
          git config user.name "CleanGutters site updater"
          git config user.email "actions@users.noreply.github.com"
          git add gutter-guard-micro-mesh-installed.* gutter-guard-micro-mesh-search-*.jpg
          git commit -m "Set gutter photo upright"
          git push
